<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin User Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            margin: 0;
            font-size: 23px;
        }

        .header p {
            margin: 5px 0 0;
            color: #64748b;
            font-size: 14px;
        }

        .back-btn {
            border: none;
            background: #eef2ff;
            color: #4338ca;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
        }

        .table-header {
            padding: 22px;
            border-bottom: 1px solid #e2e8f0;
        }

        .table-header h2 {
            margin: 0 0 5px;
            font-size: 18px;
        }

        .table-header p {
            margin: 0;
            color: #64748b;
            font-size: 13px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        td {
            font-size: 14px;
        }

        .username {
            font-weight: 700;
        }

        .email {
            color: #64748b;
            font-size: 13px;
        }

        .role {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 999px;
            background: #f1f5f9;
            font-size: 12px;
            font-weight: 700;
        }

        .role.admin {
            background: #ede9fe;
            color: #6d28d9;
        }

        .role.recruiter {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .role.hr {
            background: #dcfce7;
            color: #15803d;
        }

        .credits {
            font-weight: 700;
            color: #0f766e;
        }

        .excel-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .switch {
            position: relative;
            width: 46px;
            height: 24px;
            display: inline-block;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #cbd5e1;
            border-radius: 999px;
            cursor: pointer;
            transition: .2s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: .2s;
            box-shadow: 0 1px 3px rgba(0,0,0,.2);
        }

        .switch input:checked + .slider {
            background: #4f46e5;
        }

        .switch input:checked + .slider:before {
            transform: translateX(22px);
        }

        .permission-text {
            font-size: 12px;
            color: #64748b;
        }

        .credit-box {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .credit-box input {
            width: 90px;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        .credit-box input:focus {
            border-color: #6366f1;
        }

        .add-btn {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 8px 11px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .add-btn:hover {
            background: #4338ca;
        }

        .admin-note {
            font-size: 12px;
            color: #7c3aed;
            font-weight: 600;
        }

        .loading {
            padding: 50px;
            text-align: center;
            color: #64748b;
        }

        .empty {
            padding: 50px;
            text-align: center;
            color: #64748b;
        }

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            padding: 14px 18px;
            background: #0f172a;
            color: white;
            border-radius: 10px;
            display: none;
            z-index: 9999;
            box-shadow: 0 10px 25px rgba(0,0,0,.2);
        }
    </style>
</head>

<body>

<div class="header">

    <div>
        <h1>👥 User Management</h1>
        <p>Manage user permissions and wallet credits</p>
    </div>

    <button class="back-btn" onclick="window.location.href='/index.html'">
        ← Back to Dashboard
    </button>

</div>

<div class="container">

    <div class="card">

        <div class="table-header">

            <h2>Registered Users</h2>

            <p>
                Grant Excel import access and manage wallet credits.
            </p>

        </div>

        <div id="loading" class="loading">
            Loading users...
        </div>

        <div id="tableContainer" class="table-wrapper" style="display:none;">

            <table>

                <thead>
                <tr>
                    <th>User</th>
                    <th>Role</th>
                    <th>Excel Import</th>
                    <th>Wallet</th>
                    <th>Add Credits</th>
                </tr>
                </thead>

                <tbody id="usersBody"></tbody>

            </table>

        </div>

        <div id="empty" class="empty" style="display:none;">
            No users found.
        </div>

    </div>

</div>

<div id="toast" class="toast"></div>

<script>

async function verifyAdmin() {

    try {

        const response = await fetch("/api/auth/me", {
            method: "GET",
            credentials: "include"
        });

        if (!response.ok) {
            window.location.href = "/login.html";
            return false;
        }

        const user = await response.json();

        const role = String(user.role || "").toUpperCase();

        if (user.authenticated !== true || role !== "ADMIN") {
            alert("Admin access required.");
            window.location.href = "/index.html";
            return false;
        }

        return true;

    } catch (error) {

        console.error(error);

        window.location.href = "/login.html";

        return false;
    }
}


async function loadUsers() {

    const loading = document.getElementById("loading");
    const tableContainer = document.getElementById("tableContainer");
    const empty = document.getElementById("empty");
    const body = document.getElementById("usersBody");

    try {

        const response = await fetch("/api/admin/users", {
            method: "GET",
            credentials: "include"
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Failed to load users.");
        }

        body.innerHTML = "";

        if (!Array.isArray(data) || data.length === 0) {

            loading.style.display = "none";
            empty.style.display = "block";
            return;
        }

        data.forEach(user => {

            const row = document.createElement("tr");

            const role = String(user.role || "").toUpperCase();

            let roleClass = "";

            if (role === "ADMIN") {
                roleClass = "admin";
            } else if (role === "RECRUITER") {
                roleClass = "recruiter";
            } else {
                roleClass = "hr";
            }

            const isAdmin = role === "ADMIN";

            row.innerHTML = `
                <td>
                    <div class="username">
                        ${escapeHtml(user.fullName || user.username)}
                    </div>
                    <div class="email">
                        ${escapeHtml(user.email || "")}
                    </div>
                </td>

                <td>
                    <span class="role ${roleClass}">
                        ${escapeHtml(role)}
                    </span>
                </td>

                <td>

                    ${
                        isAdmin

                        ?

                        `<span class="admin-note">
                            Always Allowed
                        </span>`

                        :

                        `
                        <div class="excel-control">

                            <label class="switch">

                                <input
                                    type="checkbox"
                                    ${user.canUseExcel ? "checked" : ""}
                                    onchange="changeExcelPermission(
                                        ${user.id},
                                        this.checked
                                    )"
                                >

                                <span class="slider"></span>

                            </label>

                            <span class="permission-text">
                                ${user.canUseExcel ? "Enabled" : "Disabled"}
                            </span>

                        </div>
                        `
                    }

                </td>

                <td>
                    <span class="credits">
                        ${Number(user.credits || 0)} credits
                    </span>
                </td>

                <td>

                    ${
                        isAdmin

                        ?

                        `<span class="admin-note">
                            Admin
                        </span>`

                        :

                        `
                        <div class="credit-box">

                            <input
                                type="number"
                                min="1"
                                id="credits-${user.id}"
                                placeholder="Amount"
                            >

                            <button
                                class="add-btn"
                                onclick="addCredits(${user.id})"
                            >
                                + Add
                            </button>

                        </div>
                        `
                    }

                </td>
            `;

            body.appendChild(row);
        });

        loading.style.display = "none";
        tableContainer.style.display = "block";

    } catch (error) {

        console.error(error);

        loading.innerHTML =
            `<span style="color:#dc2626;">
                ${escapeHtml(error.message)}
             </span>`;
    }
}


async function changeExcelPermission(userId, enabled) {

    try {

        const response = await fetch(
            `/api/admin/users/${userId}/permissions`,
            {
                method: "PUT",
                credentials: "include",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    canUseExcel: enabled
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || "Failed to update permission."
            );
        }

        showToast(
            enabled
                ? "Excel Import permission granted."
                : "Excel Import permission revoked."
        );

        await loadUsers();

    } catch (error) {

        console.error(error);

        showToast(error.message);
        await loadUsers();
    }
}


async function addCredits(userId) {

    const input = document.getElementById(
        `credits-${userId}`
    );

    if (!input) return;

    const amount = Number(input.value);

    if (!Number.isFinite(amount) || amount <= 0) {

        showToast("Enter a valid credit amount.");
        return;
    }

    try {

        const response = await fetch(
            `/api/admin/wallet/${userId}`,
            {
                method: "PUT",
                credentials: "include",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    credits: amount
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || "Failed to add credits."
            );
        }

        input.value = "";

        showToast(
            `${amount} credits added successfully.`
        );

        await loadUsers();

    } catch (error) {

        console.error(error);

        showToast(error.message);
    }
}


function showToast(message) {

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.style.display = "block";

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(() => {

        toast.style.display = "none";

    }, 3000);
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


(async function init() {

    const isAdmin = await verifyAdmin();

    if (!isAdmin) {
        return;
    }

    await loadUsers();

})();

</script>

</body>
</html>
