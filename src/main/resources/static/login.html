<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | AI ATS Resume Checker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f5f7fb 0%,
                    #eef2ff 100%
                );

            color: #172033;
        }

        /* =====================================================
           MAIN WRAPPER
        ===================================================== */

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        /* =====================================================
           BRAND
        ===================================================== */

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            font-size: 26px;

            box-shadow:
                0 10px 25px
                rgba(37, 99, 235, .20);
        }

        .brand h1 {
            margin: 0;

            font-size: 22px;

            color: #1d4ed8;
        }

        .brand p {
            margin: 6px 0 0;

            color: #64748b;

            font-size: 12px;
        }

        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {
            background: white;

            padding: 32px;

            border-radius: 20px;

            border:
                1px solid #e5e7eb;

            box-shadow:
                0 20px 50px
                rgba(15, 23, 42, .10);
        }

        .login-card h2 {
            margin: 0;

            font-size: 22px;

            color: #172033;
        }

        .subtitle {
            margin: 7px 0 24px;

            color: #64748b;

            font-size: 13px;

            line-height: 1.5;
        }

        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {
            display: none;

            margin-bottom: 16px;

            padding: 11px 12px;

            border-radius: 9px;

            font-size: 12px;

            line-height: 1.4;
        }

        .message.error {
            display: block;

            background: #fef2f2;

            border:
                1px solid #fecaca;

            color: #dc2626;
        }

        .message.success {
            display: block;

            background: #ecfdf5;

            border:
                1px solid #bbf7d0;

            color: #15803d;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 12px;

            font-weight: 700;
        }

        input[type="text"],
        input[type="password"] {

            width: 100%;

            padding: 12px 13px;

            border:
                1px solid #dbe1ea;

            border-radius: 9px;

            outline: none;

            color: #172033;

            background: white;

            font-size: 13px;

            transition: .2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {

            border-color: #6366f1;

            box-shadow:
                0 0 0 3px
                rgba(99, 102, 241, .10);
        }

        /* =====================================================
           PASSWORD
        ===================================================== */

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 45px;
        }

        .show-password {

            position: absolute;

            right: 12px;
            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            color: #64748b;

            font-size: 16px;

            padding: 3px;
        }

        .show-password:hover {
            color: #2563eb;
        }

        /* =====================================================
           REMEMBER / FORGOT
        ===================================================== */

        .password-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin: 4px 0 22px;
        }

        .remember {

            display: flex;

            align-items: center;

            gap: 7px;

            margin: 0;

            color: #64748b;

            font-size: 11px;

            font-weight: 500;
        }

        .remember input {

            width: 14px;
            height: 14px;

            accent-color: #2563eb;

            cursor: pointer;
        }

        .forgot {

            color: #4f46e5;

            text-decoration: none;

            font-size: 11px;

            font-weight: 700;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            cursor: pointer;

            font-size: 13px;

            font-weight: 800;

            transition: .2s ease;

            box-shadow:
                0 8px 18px
                rgba(37, 99, 235, .18);
        }

        .login-btn:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 10px 22px
                rgba(37, 99, 235, .24);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* =====================================================
           REGISTER
        ===================================================== */

        .register {

            margin-top: 21px;

            padding-top: 18px;

            border-top:
                1px solid #eef0f4;

            text-align: center;

            color: #64748b;

            font-size: 12px;
        }

        .register a {

            color: #4f46e5;

            text-decoration: none;

            font-weight: 700;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            margin-top: 18px;

            text-align: center;

            color: #94a3b8;

            font-size: 10px;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            .login-wrapper {
                padding: 15px;
            }

            .login-card {
                padding: 25px 21px;
            }

            .brand h1 {
                font-size: 20px;
            }
        }

    </style>

</head>

<body>

<div class="login-wrapper">

    <!-- =====================================================
         BRAND
    ====================================================== -->

    <div class="brand">

        <div class="brand-icon">
            ◈
        </div>

        <h1>
            AI ATS Resume Checker
        </h1>

        <p>
            Intelligent Recruitment Management
        </p>

    </div>


    <!-- =====================================================
         LOGIN CARD
    ====================================================== -->

    <div class="login-card">

        <h2>
            Welcome back
        </h2>

        <p class="subtitle">
            Sign in to continue to your recruiter dashboard.
        </p>


        <!-- =================================================
             ERROR MESSAGE
        ================================================== -->

        <div
            id="errorMessage"
            class="message">

            Invalid username or password.

        </div>


        <!-- =================================================
             LOGOUT MESSAGE
        ================================================== -->

        <div
            id="logoutMessage"
            class="message">

            You have been logged out successfully.

        </div>


        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form
            method="POST"
            action="/login"
            id="loginForm">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-container">

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                        aria-label="Show password">

                        👁

                    </button>

                </div>

            </div>


            <!-- REMEMBER / FORGOT -->

            <div class="password-row">

                <label class="remember">

                    <input
                        type="checkbox"
                        name="remember-me">

                    Remember me

                </label>


                <a
                    <a href="/forgot-password.html">
    Forgot password?
</a>

                </a>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
                id="loginButton">

                LOGIN

            </button>

        </form>


        <!-- =================================================
             REGISTER
        ================================================== -->

        <div class="register">

            New user?

            <a href="/register.html">
                Create an account
            </a>

        </div>

    </div>


    <div class="footer">

        © 2026 AI ATS Resume Checker

    </div>

</div>


<script>

    // =========================================================
    // SHOW / HIDE PASSWORD
    // =========================================================

    function togglePassword() {

        const password =
            document.getElementById(
                "password"
            );

        const button =
            document.querySelector(
                ".show-password"
            );

        if (
            password.type ===
            "password"
        ) {

            password.type =
                "text";

            button.textContent =
                "🙈";

        } else {

            password.type =
                "password";

            button.textContent =
                "👁";
        }
    }


    // =========================================================
    // URL PARAMETERS
    // =========================================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    // =========================================================
    // LOGIN ERROR
    // =========================================================

    if (
        params.get("error") ===
        "true"
    ) {

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );

        errorMessage.className =
            "message error";

        errorMessage.textContent =
            "Invalid username or password.";

    }


    // =========================================================
    // LOGOUT MESSAGE
    // =========================================================

    if (
        params.get("logout") ===
        "true"
    ) {

        const logoutMessage =
            document.getElementById(
                "logoutMessage"
            );

        logoutMessage.className =
            "message success";

        logoutMessage.textContent =
            "You have been logged out successfully.";

    }


    // =========================================================
    // LOGIN BUTTON LOADING
    // =========================================================

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            function () {

                const button =
                    document.getElementById(
                        "loginButton"
                    );

                button.disabled = true;

                button.textContent =
                    "SIGNING IN...";

            }
        );

</script>

</body>

</html>
