<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AI ATS Resume Checker</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            color: #172033;

            padding: 25px;
        }

        .register-wrapper {
            width: 100%;
            max-width: 480px;
        }

        /* =====================================================
           BRAND
        ===================================================== */

        .brand {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-icon {
            width: 50px;
            height: 50px;

            margin: 0 auto 12px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            font-size: 23px;

            box-shadow:
                0 10px 25px
                rgba(37, 99, 235, .20);
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 800;

            color: #172033;
        }

        .brand p {
            margin-top: 5px;

            color: #64748b;

            font-size: 12px;
        }

        /* =====================================================
           CARD
        ===================================================== */

        .register-card {
            background: white;

            border:
                1px solid
                #e5e7eb;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 18px 50px
                rgba(15, 23, 42, .08);
        }

        .register-card h2 {
            font-size: 22px;
            font-weight: 800;

            margin-bottom: 5px;
        }

        .subtitle {
            color: #64748b;

            font-size: 12px;

            margin-bottom: 25px;
        }

        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {
            display: none;

            padding: 12px 14px;

            margin-bottom: 18px;

            border-radius: 9px;

            font-size: 12px;

            line-height: 1.5;
        }

        .message.error {
            display: block;

            background: #fef2f2;

            color: #b91c1c;

            border: 1px solid #fecaca;
        }

        .message.success {
            display: block;

            background: #f0fdf4;

            color: #15803d;

            border: 1px solid #bbf7d0;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 11px;

            font-weight: 700;

            color: #475569;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            padding: 12px 13px;

            border:
                1px solid
                #dbe1ea;

            border-radius: 9px;

            outline: none;

            font-size: 13px;

            background: white;

            color: #172033;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px
                rgba(99, 102, 241, .10);
        }

        /* =====================================================
           PASSWORD
        ===================================================== */

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 45px;
        }

        .show-password {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 16px;

            color: #64748b;
        }

        .show-password:hover {
            color: #2563eb;
        }

        /* =====================================================
           ROLE
        ===================================================== */

        .role-info {
            margin-top: 7px;

            font-size: 10px;

            color: #94a3b8;

            line-height: 1.5;
        }

        /* =====================================================
           BUTTON
        ===================================================== */

        .register-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                opacity .2s ease;

            box-shadow:
                0 8px 18px
                rgba(37, 99, 235, .18);
        }

        .register-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 22px
                rgba(37, 99, 235, .24);
        }

        .register-btn:disabled {
            opacity: .65;

            cursor: not-allowed;

            transform: none;
        }

        /* =====================================================
           LOGIN
        ===================================================== */

        .login-link {
            margin-top: 20px;

            padding-top: 17px;

            border-top:
                1px solid
                #eef0f4;

            text-align: center;

            color: #64748b;

            font-size: 12px;
        }

        .login-link a {
            color: #4f46e5;

            text-decoration: none;

            font-weight: 700;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {
            margin-top: 18px;

            text-align: center;

            color: #94a3b8;

            font-size: 10px;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .register-card {
                padding: 23px 20px;
            }

            .brand h1 {
                font-size: 20px;
            }
        }

    </style>

</head>

<body>

<div class="register-wrapper">

    <!-- =====================================================
         BRAND
    ===================================================== -->

    <div class="brand">

        <div class="brand-icon">
            ◈
        </div>

        <h1>
            AI ATS Resume Checker
        </h1>

        <p>
            Intelligent Recruitment Management
        </p>

    </div>


    <!-- =====================================================
         REGISTER CARD
    ===================================================== -->

    <div class="register-card">

        <h2>
            Create your account
        </h2>

        <p class="subtitle">
            Create an account to access the recruitment dashboard.
        </p>


        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div
            id="message"
            class="message">
        </div>


        <!-- =================================================
             FORM
        ================================================== -->

        <form
            id="registerForm"
            autocomplete="off">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    id="fullName"
                    type="text"
                    placeholder="Enter your full name"
                    required>

            </div>


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-container">

                    <input
                        id="password"
                        type="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('password', this)"
                        aria-label="Show password">

                        👁

                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-container">

                    <input
                        id="confirmPassword"
                        type="password"
                        placeholder="Repeat your password"
                        autocomplete="new-password"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword', this)"
                        aria-label="Show password">

                        👁

                    </button>

                </div>

            </div>


            <!-- ROLE -->

            <div class="form-group">

                <label for="role">
                    Account Type
                </label>

                <select
                    id="role"
                    required>

                    <option value="HR">
                        HR
                    </option>

                    <option value="RECRUITER">
                        Recruiter
                    </option>

                </select>

                <div class="role-info">
                    Administrator accounts are managed separately for security.
                </div>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="register-btn"
                id="registerButton">

                CREATE ACCOUNT

            </button>

        </form>


        <!-- =================================================
             LOGIN
        ================================================== -->

        <div class="login-link">

            Already have an account?

            <a href="/login.html">
                Login
            </a>

        </div>

    </div>


    <div class="footer">

        © 2026 AI ATS Resume Checker

    </div>

</div>


<script>

    // =====================================================
    // SHOW / HIDE PASSWORD
    // =====================================================

    function togglePassword(
        inputId,
        button
    ) {

        const input =
            document.getElementById(inputId);

        if (!input) {
            return;
        }

        if (input.type === "password") {

            input.type = "text";

            button.textContent = "🙈";

        } else {

            input.type = "password";

            button.textContent = "👁";
        }
    }


    // =====================================================
    // SHOW MESSAGE
    // =====================================================

    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.className =
            "message " + type;
    }


    // =====================================================
    // REGISTER
    // =====================================================

    document
        .getElementById("registerForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const button =
                    document.getElementById(
                        "registerButton"
                    );


                const fullName =
                    document.getElementById(
                        "fullName"
                    ).value.trim();


                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                const role =
                    document.getElementById(
                        "role"
                    ).value;


                // -------------------------------------------------
                // VALIDATION
                // -------------------------------------------------

                if (
                    !fullName ||
                    !username ||
                    !email ||
                    !password
                ) {

                    showMessage(
                        "Please fill in all required fields.",
                        "error"
                    );

                    return;
                }


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;
                }


                if (password.length < 6) {

                    showMessage(
                        "Password must contain at least 6 characters.",
                        "error"
                    );

                    return;
                }


                // -------------------------------------------------
                // LOADING
                // -------------------------------------------------

                button.disabled = true;

                button.textContent =
                    "CREATING ACCOUNT...";


                try {

                    const response =
                        await fetch(
                            "/api/auth/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                credentials: "include",

                                body: JSON.stringify({

                                    fullName:
                                        fullName,

                                    username:
                                        username,

                                    email:
                                        email,

                                    password:
                                        password,

                                    role:
                                        role

                                })
                            }
                        );


                    const contentType =
                        response.headers
                            .get("content-type") || "";


                    let result;


                    if (
                        contentType
                            .includes("application/json")
                    ) {

                        result =
                            await response.json();

                    } else {

                        result = {
                            message:
                                await response.text()
                        };
                    }


                    if (!response.ok) {

                        throw new Error(
                            result.message ||
                            result.error ||
                            "Account creation failed."
                        );
                    }


                    showMessage(
                        result.message ||
                        "Account created successfully. Redirecting to login...",
                        "success"
                    );


                    document
                        .getElementById(
                            "registerForm"
                        )
                        .reset();


                    setTimeout(
                        function () {

                            window.location.href =
                                "/login.html";

                        },
                        1200
                    );


                } catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Unable to create account.",
                        "error"
                    );


                } finally {

                    button.disabled = false;

                    button.textContent =
                        "CREATE ACCOUNT";
                }

            }
        );

</script>

</body>

</html>
