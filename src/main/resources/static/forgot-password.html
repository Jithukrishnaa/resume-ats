<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | AI ATS Resume Checker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f5f7fb 0%,
                    #eef2ff 100%
                );

            color: #172033;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        /* ================= BRAND ================= */

        .brand {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-icon {
            width: 55px;
            height: 55px;

            margin: 0 auto 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            font-size: 25px;

            box-shadow:
                0 10px 25px
                rgba(37, 99, 235, .20);
        }

        .brand h1 {
            margin: 0;

            color: #1d4ed8;

            font-size: 21px;
        }

        .brand p {
            margin: 5px 0 0;

            color: #64748b;

            font-size: 11px;
        }

        /* ================= CARD ================= */

        .card {
            background: white;

            padding: 30px;

            border-radius: 20px;

            border:
                1px solid #e5e7eb;

            box-shadow:
                0 20px 50px
                rgba(15, 23, 42, .10);
        }

        .card h2 {
            margin: 0;

            font-size: 21px;
        }

        .subtitle {
            margin: 7px 0 23px;

            color: #64748b;

            font-size: 12px;

            line-height: 1.6;
        }

        /* ================= MESSAGE ================= */

        .message {
            display: none;

            padding: 11px 12px;

            margin-bottom: 16px;

            border-radius: 9px;

            font-size: 11px;

            line-height: 1.5;
        }

        .message.error {
            display: block;

            color: #dc2626;

            background: #fef2f2;

            border:
                1px solid #fecaca;
        }

        .message.success {
            display: block;

            color: #15803d;

            background: #ecfdf5;

            border:
                1px solid #bbf7d0;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 11px;

            font-weight: 700;
        }

        input {
            width: 100%;

            padding: 12px;

            border:
                1px solid #dbe1ea;

            border-radius: 9px;

            outline: none;

            color: #172033;

            background: white;

            font-size: 12px;

            transition: .2s ease;
        }

        input:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px
                rgba(99, 102, 241, .10);
        }

        /* ================= BUTTON ================= */

        .reset-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            cursor: pointer;

            font-size: 12px;

            font-weight: 800;

            box-shadow:
                0 8px 18px
                rgba(37, 99, 235, .18);

            transition: .2s ease;
        }

        .reset-btn:hover {
            transform: translateY(-1px);
        }

        .reset-btn:disabled {
            opacity: .6;

            cursor: not-allowed;

            transform: none;
        }

        /* ================= BACK LOGIN ================= */

        .back-login {
            margin-top: 20px;

            padding-top: 17px;

            border-top:
                1px solid #eef0f4;

            text-align: center;

            color: #64748b;

            font-size: 11px;
        }

        .back-login a {
            color: #4f46e5;

            text-decoration: none;

            font-weight: 700;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        /* ================= FOOTER ================= */

        .footer {
            margin-top: 15px;

            text-align: center;

            color: #94a3b8;

            font-size: 9px;
        }

    </style>

</head>

<body>

<div class="wrapper">

    <!-- =====================================================
         BRAND
    ====================================================== -->

    <div class="brand">

        <div class="brand-icon">
            ◈
        </div>

        <h1>
            AI ATS Resume Checker
        </h1>

        <p>
            Intelligent Recruitment Management
        </p>

    </div>


    <!-- =====================================================
         CARD
    ====================================================== -->

    <div class="card">

        <h2>
            Forgot your password?
        </h2>

        <p class="subtitle">
            Enter the email address associated with your
            recruiter account and we'll help you reset your password.
        </p>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>


        <!-- FORM -->

        <form id="forgotForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required>

            </div>


            <button
                id="resetButton"
                class="reset-btn"
                type="submit">

                SEND RESET LINK

            </button>

        </form>


        <!-- BACK TO LOGIN -->

        <div class="back-login">

            Remember your password?

            <a href="/login.html">
                Back to login
            </a>

        </div>

    </div>


    <div class="footer">

        © 2026 AI ATS Resume Checker

    </div>

</div>


<script>

    const form =
        document.getElementById(
            "forgotForm"
        );

    const email =
        document.getElementById(
            "email"
        );

    const message =
        document.getElementById(
            "message"
        );

    const button =
        document.getElementById(
            "resetButton"
        );


    // =========================================================
    // MESSAGE
    // =========================================================

    function showMessage(
        text,
        type
    ) {

        message.className =
            "message " + type;

        message.textContent =
            text;

        message.style.display =
            "block";
    }


    function clearMessage() {

        message.className =
            "message";

        message.textContent = "";

        message.style.display =
            "none";
    }


    // =========================================================
    // SUBMIT
    // =========================================================

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            clearMessage();

            const emailValue =
                email.value.trim();


            if (!emailValue) {

                showMessage(
                    "Please enter your email address.",
                    "error"
                );

                return;
            }


            button.disabled = true;

            button.textContent =
                "PROCESSING...";


            try {

                const response =
                    await fetch(
                        "/api/auth/password/forgot",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    email:
                                        emailValue
                                })
                        }
                    );


                const data =
                    await response.json();


                // =================================================
                // ERROR
                // =================================================

                if (!response.ok) {

                    showMessage(
                        data.message ||
                        "Unable to process your request.",
                        "error"
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        "SEND RESET LINK";

                    return;
                }


                // =================================================
                // SUCCESS
                // =================================================

                showMessage(
                    data.message ||
                    "Password reset request created.",
                    "success"
                );


                /*
                 * DEVELOPMENT MODE
                 *
                 * Our backend currently returns the reset token
                 * because we have not connected email yet.
                 *
                 * We use that token to open reset-password.html.
                 */

                if (data.token) {

                    const resetUrl =
                        "/reset-password.html?token="
                        + encodeURIComponent(
                            data.token
                        );


                    setTimeout(
                        function () {

                            window.location.href =
                                resetUrl;

                        },
                        1200
                    );

                }


            } catch (error) {

                console.error(
                    "Forgot password error:",
                    error
                );

                showMessage(
                    "Unable to connect to the server. Please try again.",
                    "error"
                );

                button.disabled =
                    false;

                button.textContent =
                    "SEND RESET LINK";
            }

        }
    );

</script>

</body>

</html>
